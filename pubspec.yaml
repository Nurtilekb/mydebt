name: dolzhok
description: "Должок — учёт долгов между друзьями"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  firebase_messaging: ^15.2.10

  # State management
  provider: ^6.1.2

  # Contacts
  flutter_contacts: ^1.1.7+1

  # Phone formatting
  intl: ^0.20.2

  # Shared preferences (for FCM token storage)
  shared_preferences: ^2.5.3

  # Icons
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
